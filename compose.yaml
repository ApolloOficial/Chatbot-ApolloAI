services:
  apolloai:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI:?Configure MONGODB_URI remota}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-apollo_ai}
      MONGODB_REQUIRED: ${MONGODB_REQUIRED:-true}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-10000}
      REDIS_URL: ${REDIS_URL:?Configure REDIS_URL remota}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:?Configure CORS_ORIGINS HTTPS}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-true}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:?Configure PUBLIC_BASE_URL HTTPS}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-20b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      AI_MAX_RETRIES: ${AI_MAX_RETRIES:-1}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APOLLOAI_API_TOKEN: ${APOLLOAI_API_TOKEN:?Configure APOLLOAI_API_TOKEN}
      QDRANT_URL: ${QDRANT_URL:?Configure QDRANT_URL HTTPS remota}
      QDRANT_API_KEY: ${QDRANT_API_KEY:?Configure QDRANT_API_KEY}
      QDRANT_VECTOR_SIZE: ${QDRANT_VECTOR_SIZE:-768}
      QDRANT_TIMEOUT_SECONDS: ${QDRANT_TIMEOUT_SECONDS:-10}
      RAG_TOP_K: ${RAG_TOP_K:-5}
      RAG_MIN_SCORE: ${RAG_MIN_SCORE:-0.08}
      AWS_LAB_BUDGET_USD: ${AWS_LAB_BUDGET_USD:-50}
      AWS_MONTHLY_COST_100_USERS: ${AWS_MONTHLY_COST_100_USERS:-12.80}
      AWS_MONTHLY_COST_1000_USERS: ${AWS_MONTHLY_COST_1000_USERS:-20.40}
      AI_FREE_DAILY_REQUEST_LIMIT: ${AI_FREE_DAILY_REQUEST_LIMIT:-1000}
      AI_FREE_DAILY_TOKEN_LIMIT: ${AI_FREE_DAILY_TOKEN_LIMIT:-200000}
