services:
  apolloai:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-apollo_ai}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-10000}
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5000
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APOLLOAI_API_TOKEN: ${APOLLOAI_API_TOKEN:-}
    depends_on:
      redis:
        condition: service_healthy

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  redis_data:
