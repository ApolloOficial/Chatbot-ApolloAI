services:
  apolloai:
    build: .
    ports:
      - "5000:5000"
    environment:
      MONGODB_URI: ${MONGODB_URI}
      MONGODB_DATABASE: ${MONGODB_DATABASE:-apollo_ai}
      MONGODB_REQUIRED: ${MONGODB_REQUIRED:-true}
      MONGODB_TIMEOUT_MS: ${MONGODB_TIMEOUT_MS:-10000}
      REDIS_URL: ${REDIS_URL}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_REQUIRED: ${REDIS_REQUIRED:-true}
      REDIS_TIMEOUT_SECONDS: ${REDIS_TIMEOUT_SECONDS:-5}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      AUTH_REQUIRED: ${AUTH_REQUIRED:-false}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:5000}
      AI_PROVIDER: ${AI_PROVIDER:-groq}
      AI_MODEL: ${AI_MODEL:-openai/gpt-oss-120b}
      AI_TIMEOUT_SECONDS: ${AI_TIMEOUT_SECONDS:-30}
      GROQ_API_KEY: ${GROQ_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      APOLLOAI_API_TOKEN: ${APOLLOAI_API_TOKEN:-}
