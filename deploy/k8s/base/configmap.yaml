apiVersion: v1
kind: ConfigMap
metadata:
  name: apolloai-config
data:
  AUTH_REQUIRED: "true"
  MONGODB_REQUIRED: "true"
  REDIS_ENABLED: "true"
  REDIS_REQUIRED: "true"
  REDIS_TIMEOUT_SECONDS: "5"
  MCP_REQUIRED: "true"
  MCP_SERVER_COMMAND: "python -m app.mcp_server"
  PUBLIC_BASE_URL: "https://apolloai.example.invalid"
  CORS_ORIGINS: "https://apollo.example.invalid"
  AI_PROVIDER: "groq"
  AI_MODEL: "openai/gpt-oss-20b"
  QDRANT_URL: "https://qdrant.example.invalid"
  QDRANT_TIMEOUT_SECONDS: "10"
  AWS_LAB_BUDGET_USD: "50"
  AWS_MONTHLY_COST_100_USERS: "12.50"
  AWS_MONTHLY_COST_1000_USERS: "20.10"
  AI_FREE_DAILY_REQUEST_LIMIT: "1000"
  AI_FREE_DAILY_TOKEN_LIMIT: "200000"
