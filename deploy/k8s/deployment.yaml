apiVersion: apps/v1
kind: Deployment
metadata:
  name: apolloai
spec:
  replicas: 2
  selector:
    matchLabels:
      app: apolloai
  template:
    metadata:
      labels:
        app: apolloai
    spec:
      containers:
        - name: apolloai
          image: ghcr.io/replace-with-owner/apolloai:replace-with-tag
          ports:
            - name: http
              containerPort: 5000
          envFrom:
            - configMapRef:
                name: apolloai-config
            - secretRef:
                name: apolloai-secrets
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 4
          livenessProbe:
            httpGet:
              path: /live
              port: http
            initialDelaySeconds: 20
            periodSeconds: 30
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
