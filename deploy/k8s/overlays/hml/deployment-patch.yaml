apiVersion: apps/v1
kind: Deployment
metadata:
  name: apolloai
spec:
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app.kubernetes.io/environment: homologacao
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: apolloai
          startupProbe:
            httpGet:
              path: /live
              port: http
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 12
