name: ApolloAI CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated test suite
        run: python -m pytest -m "not integration" -q
  container-smoke:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image without local dependencies
        run: docker build -t apolloai-ci .

  secret-scan:
    name: Tracked credential scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Reject tracked credentials
        run: python scripts/check_tracked_secrets.py

  k3s-manifest-smoke:
    name: Render K3s manifests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up kubectl
        uses: azure/setup-kubectl@v4
      - name: Check deployment scripts
        run: shellcheck deploy/k3s/*.sh
      - name: Render the AWS Lab overlay
        run: |
          python deploy/k3s/render.py \
            --host 98.84.34.155 \
            --cors-origin https://98.84.34.155 \
            --qdrant-url https://cluster.aws.cloud.qdrant.io:6333 \
            --image-tag sha-0000000000000000000000000000000000000000 \
            --acme-email equipe@apolloai.example.com \
            > /tmp/apolloai-k3s.yaml
          if grep -E '\.invalid|replace-with|CHANGE_ME' /tmp/apolloai-k3s.yaml; then
            echo "Manifesto contém configuração provisória." >&2
            exit 1
          fi
          grep -q 'ingressClassName: traefik' /tmp/apolloai-k3s.yaml
          grep -q 'kind: ClusterIssuer' /tmp/apolloai-k3s.yaml
          grep -q 'profile: shortlived' /tmp/apolloai-k3s.yaml
          grep -q 'kind: Certificate' /tmp/apolloai-k3s.yaml
          grep -q 'kind: TLSStore' /tmp/apolloai-k3s.yaml
          grep -q '98.84.34.155' /tmp/apolloai-k3s.yaml
          grep -q 'kind: Deployment' /tmp/apolloai-k3s.yaml

  publish-image:
    name: Publish commit image
    if: github.event_name == 'push'
    needs: [tests, container-smoke, secret-scan, k3s-manifest-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Authenticate to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_tag="sha-${GITHUB_SHA}"
          docker build --tag "${image_repository}:${image_tag}" .
          docker push "${image_repository}:${image_tag}"
          echo "Published ${image_repository}:${image_tag}" >> "$GITHUB_STEP_SUMMARY"
