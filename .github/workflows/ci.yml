name: ApolloAI CI

on:
  push:
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated test suite
        run: python -m pytest -m "not integration" -q
  container-smoke:
    name: Container image build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build image without local dependencies
        run: docker build -t apolloai-ci .

  publish-image:
    name: Publish commit image
    if: github.event_name == 'push'
    needs: [tests, container-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Authenticate to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable image
        env:
          IMAGE_REPOSITORY: ghcr.io/${{ github.repository }}
        run: |
          image_repository="$(printf '%s' "$IMAGE_REPOSITORY" | tr '[:upper:]' '[:lower:]')"
          image_tag="sha-${GITHUB_SHA}"
          docker build --tag "${image_repository}:${image_tag}" .
          docker push "${image_repository}:${image_tag}"
          echo "Published ${image_repository}:${image_tag}" >> "$GITHUB_STEP_SUMMARY"
