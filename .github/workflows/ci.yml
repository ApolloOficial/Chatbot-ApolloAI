name: ApolloAI CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit and protocol tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Run isolated test suite
        run: python -m pytest -m "not integration" -q
      - name: Evaluate RAG retrieval quality
        run: python scripts/evaluate_rag.py
      - name: Run real MCP stdio contract
        env:
          RUN_MCP_INTEGRATION: "1"
        run: python -m pytest -m integration -q

  container-smoke:
    name: Container stack smoke test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Build and start stack
        run: docker compose up --build --detach
      - name: Wait for required services
        shell: bash
        run: |
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:5000/health; then
              exit 0
            fi
            sleep 2
          done
          docker compose logs
          exit 1
      - name: Show logs on failure
        if: failure()
        run: docker compose logs
      - name: Stop stack
        if: always()
        run: docker compose down --volumes
